<!DOCTYPE html>
<html lang="ka" class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="განათავსე საზღვაო ვაკანსია და მიაწოდე ის ვერიფიცირებულ მეზღვაურებს." />
    <link rel="canonical" href="https://georgee-21.github.io/navigojobs/post-job.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NavigoJobs" />
    <meta property="og:title" content="ვაკანსიის განთავსება — NavigoJobs" />
    <meta property="og:description" content="განათავსე საზღვაო ვაკანსია და მიაწოდე ის ვერიფიცირებულ მეზღვაურებს." />
    <meta property="og:url" content="https://georgee-21.github.io/navigojobs/post-job.html" />
    <meta property="og:image" content="https://georgee-21.github.io/navigojobs/assets/images/hero-poster.jpg" />
    <title>ვაკანსიის განთავსება — NavigoJobs</title>

    <script>
      try {
        if (localStorage.getItem("nj-theme") === "light") document.documentElement.className = "theme-light";
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="page" data-page="postJob">
    <a class="skip-link" href="#main" data-i18n="ui.skipLink">მთავარ შინაარსზე გადასვლა</a>

    <div data-layout="header"></div>

    <main id="main">
      <header class="page-hero">
        <div class="page-hero-bg page-hero-bg-postjob" aria-hidden="true"></div>
        <div class="page-hero-overlay" aria-hidden="true"></div>
        <div class="page-hero-content">
          <a href="index.html" class="back-link text-mono" data-i18n="postJobPage.backHome">← მთავარი</a>
          <div class="page-hero-text glass-panel">
            <div class="section-label" data-i18n="postJobPage.kicker">// მოძებნე შენი ეკიპაჟი</div>
            <h1 class="title page-hero-title" data-i18n="postJobPage.title">ვაკანსიის განთავსება</h1>
            <p class="text" data-i18n="postJobPage.sub">შეავსე ვაკანსიის დეტალები და მიაწოდე ინფორმაცია ვერიფიცირებულ მეზღვაურებს.</p>
          </div>
        </div>
      </header>

      <section class="section form-section">
        <form class="form" data-nj-form>
            <div class="form-row">
              <div class="form-field">
                <label class="form-label" for="pj-companyName" data-i18n="postJobPage.fields.companyName">კომპანიის დასახელება</label>
                <input class="form-input" id="pj-companyName" name="companyName" type="text" autocomplete="organization" required />
              </div>
              <div class="form-field">
                <label class="form-label" for="pj-contactEmail" data-i18n="postJobPage.fields.contactEmail">საკონტაქტო ელ. ფოსტა</label>
                <input class="form-input" id="pj-contactEmail" name="contactEmail" type="email" autocomplete="email" required />
              </div>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label class="form-label" for="pj-rank" data-i18n="postJobPage.fields.rank">საჭირო რანგი / პოზიცია</label>
                <input class="form-input" id="pj-rank" name="rank" type="text" required />
              </div>
              <div class="form-field">
                <label class="form-label" for="pj-department" data-i18n="postJobPage.fields.department">დეპარტამენტი</label>
                <select class="form-select" id="pj-department" name="department" required><option value="" disabled selected>აირჩიე...</option></select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label class="form-label" for="pj-vesselType" data-i18n="postJobPage.fields.vesselType">გემის ტიპი</label>
                <input class="form-input" id="pj-vesselType" name="vesselType" type="text" required />
              </div>
              <div class="form-field">
                <label class="form-label" for="pj-zone" data-i18n="postJobPage.fields.zone">სარეისო ზონა</label>
                <input class="form-input" id="pj-zone" name="zone" type="text" required />
              </div>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label class="form-label" for="pj-contract" data-i18n="postJobPage.fields.contract">კონტრაქტის ხანგრძლივობა</label>
                <input class="form-input" id="pj-contract" name="contract" type="text" required />
              </div>
              <div class="form-field">
                <label class="form-label" for="pj-salary" data-i18n="postJobPage.fields.salary">ანაზღაურება</label>
                <input class="form-input" id="pj-salary" name="salary" type="text" required />
              </div>
            </div>
            <div class="form-field">
                <label class="form-label" for="pj-description" data-i18n="postJobPage.fields.description">ვაკანსიის აღწერა</label>
                <textarea class="form-textarea" id="pj-description" name="description"></textarea>
              </div>
            <input class="form-honeypot" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" />
            <div class="form-consent">
              <input id="pj-consent" name="consent" type="checkbox" value="yes" required />
              <label for="pj-consent"><span data-i18n="ui.consentLabel"></span> <a href="privacy.html" data-i18n="ui.consentLink"></a></label>
            </div>
            <p class="form-error" data-form-error role="alert" hidden></p>
            <div class="form-buttons">
              <button class="btn-primary" type="submit" data-i18n="postJobPage.submitBtn">ვაკანსიის განთავსება</button>
            </div>
        </form>
        <div class="form-success" data-success tabindex="-1" role="status" hidden>
          <div class="form-success-icon" aria-hidden="true">🚢</div>
          <div class="form-success-title" data-i18n="postJobPage.successTitle">ვაკანსია განთავსდა!</div>
          <p class="text" data-i18n="postJobPage.successMsg">შენი ვაკანსია გადაეცა მოდერაციას და მალე გამოჩნდება სიაში.</p>
        </div>
      </section>
    </main>

    <div data-layout="footer"></div>

    <script src="js/translations.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/forms.js" defer></script>
  </body>
</html>
