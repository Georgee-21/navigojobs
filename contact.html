<!DOCTYPE html>
<html lang="ka" class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NavigoJobs-ის საკონტაქტო ინფორმაცია — ტელეფონი, ელ. ფოსტა, ოფისი ბათუმის ნავსადგურში." />
    <link rel="canonical" href="https://georgee-21.github.io/navigojobs/contact.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NavigoJobs" />
    <meta property="og:title" content="კონტაქტი — NavigoJobs" />
    <meta property="og:description" content="NavigoJobs-ის საკონტაქტო ინფორმაცია — ტელეფონი, ელ. ფოსტა, ოფისი ბათუმის ნავსადგურში." />
    <meta property="og:url" content="https://georgee-21.github.io/navigojobs/contact.html" />
    <meta property="og:image" content="https://georgee-21.github.io/navigojobs/assets/images/hero-poster.jpg" />
    <title>კონტაქტი — NavigoJobs</title>

    <script>
      try {
        if (localStorage.getItem("nj-theme") === "light") document.documentElement.className = "theme-light";
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/contact.css" />
  </head>
  <body class="page" data-page="contact">
    <a class="skip-link" href="#main" data-i18n="ui.skipLink">მთავარ შინაარსზე გადასვლა</a>

    <div data-layout="header"></div>

    <main id="main">
      <header class="page-hero">
        <div class="page-hero-bg page-hero-bg-contact" aria-hidden="true"></div>
        <div class="page-hero-overlay" aria-hidden="true"></div>
        <div class="page-hero-content">
          <a href="index.html" class="back-link text-mono" data-i18n="contactPage.backHome">← მთავარი</a>
          <div class="page-hero-text glass-panel">
            <div class="section-label" data-i18n="contactPage.kicker">// დაგვიკავშირდი</div>
            <h1 class="title page-hero-title" data-i18n="contactPage.title">საკონტაქტო ინფორმაცია</h1>
            <p class="text" data-i18n="contactPage.sub">გაქვს კითხვები? დაგვიკავშირდი პირდაპირ — ჩვენი გუნდი მზადაა დაგეხმაროს.</p>
          </div>
        </div>
      </header>

      <section class="section contact-section">
        <address class="contact-grid">
          <a class="contact-card" href="tel:+995555123456">
            <div class="contact-icon" aria-hidden="true">☎</div>
            <div class="contact-label text-mono" data-i18n="contactPage.phoneLabel">ტელეფონი</div>
            <div class="contact-value" data-i18n="contactPage.phoneValue">+995 555 12 34 56</div>
          </a>
          <a class="contact-card" href="mailto:info@navigojobs.ge">
            <div class="contact-icon" aria-hidden="true">✉</div>
            <div class="contact-label text-mono" data-i18n="contactPage.emailLabel">ელ. ფოსტა</div>
            <div class="contact-value" data-i18n="contactPage.emailValue">info@navigojobs.ge</div>
          </a>
          <div class="contact-card">
            <div class="contact-icon" aria-hidden="true">📍</div>
            <div class="contact-label text-mono" data-i18n="contactPage.addressLabel">მისამართი</div>
            <div class="contact-value" data-i18n="contactPage.addressValue">ბათუმის საზღვაო ნავსადგური, ბათუმი, საქართველო</div>
          </div>
        </address>

        <div class="contact-location">
          <h2 class="contact-map-title text-mono" data-i18n="contactPage.mapTitle">ჩვენი ოფისის ლოკაცია</h2>
          <div class="contact-map">
            <iframe title="Batumi Sea Port — map" src="https://www.google.com/maps?q=Batumi+Sea+Port,+Batumi,+Georgia&amp;output=embed" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
        </div>
      </section>
    </main>

    <div data-layout="footer"></div>

    <script src="js/translations.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/main.js" defer></script>
  </body>
</html>
