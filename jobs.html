<!DOCTYPE html>
<html lang="ka" class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ღია საზღვაო ვაკანსიები დეპარტამენტების მიხედვით — Deck, Engine, Galley, Bridge." />
    <link rel="canonical" href="https://georgee-21.github.io/navigojobs/jobs.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NavigoJobs" />
    <meta property="og:title" content="ვაკანსიები — NavigoJobs" />
    <meta property="og:description" content="ღია საზღვაო ვაკანსიები დეპარტამენტების მიხედვით — Deck, Engine, Galley, Bridge." />
    <meta property="og:url" content="https://georgee-21.github.io/navigojobs/jobs.html" />
    <meta property="og:image" content="https://georgee-21.github.io/navigojobs/assets/images/hero-poster.jpg" />
    <title>ვაკანსიები — NavigoJobs</title>

    <script>
      try {
        if (localStorage.getItem("nj-theme") === "light") document.documentElement.className = "theme-light";
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/jobs.css" />
  </head>
  <body class="page" data-page="jobs">
    <a class="skip-link" href="#main" data-i18n="ui.skipLink">მთავარ შინაარსზე გადასვლა</a>

    <div data-layout="header"></div>

    <main id="main">
      <header class="page-hero">
        <div class="page-hero-bg page-hero-bg-jobs" aria-hidden="true"></div>
        <div class="page-hero-overlay" aria-hidden="true"></div>
        <div class="page-hero-content">
          <a href="index.html" class="back-link text-mono" data-i18n="jobsPage.backHome">← მთავარი</a>
          <div class="page-hero-text glass-panel">
            <div class="section-label" data-i18n="jobsPage.kicker">// ღია ვაკანსიების სია</div>
            <h1 class="title page-hero-title" data-i18n="jobsPage.title">ვაკანსიები</h1>
            <p class="text" data-i18n="jobsPage.sub">გაფილტრე დეპარტამენტის მიხედვით და იპოვე შენი შემდეგი კონტრაქტი.</p>
          </div>
        </div>
      </header>

      <section class="section jobs-section">
        <div class="jobs-toolbar">
          <label class="visually-hidden" for="nj-jobs-search" data-i18n="jobsPage.searchLabel">ვაკანსიების ძებნა</label>
          <input type="search" id="nj-jobs-search" class="jobs-search" data-i18n-placeholder="jobsPage.searchPlaceholder" placeholder="ძებნა — რანგი, გემი, ზონა..." autocomplete="off" />
          <div class="jobs-filters" id="nj-jobs-filters" role="group" data-i18n-aria-label="jobsPage.filterLabel" aria-label="დეპარტამენტის ფილტრი"></div>
        </div>
        <div class="jobs-count text-mono" id="nj-jobs-count" aria-live="polite"></div>
        <ul class="jobs-grid" id="nj-jobs-grid"></ul>
        <p class="jobs-empty text" id="nj-jobs-empty" data-i18n="jobsPage.noResults" hidden>შენს ფილტრს ვაკანსია არ ემთხვევა — სცადე სხვა კრიტერიუმი.</p>
      </section>
    </main>

    <div data-layout="footer"></div>

    <script src="js/translations.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/jobs.js" defer></script>
  </body>
</html>
