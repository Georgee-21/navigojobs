<!DOCTYPE html>
<html lang="ka" class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="დარეგისტრირდი როგორც საკადრო სააგენტო ან გემთმფლობელი NavigoJobs-ზე." />
    <link rel="canonical" href="https://georgee-21.github.io/navigojobs/register-company.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NavigoJobs" />
    <meta property="og:title" content="კომპანიის რეგისტრაცია — NavigoJobs" />
    <meta property="og:description" content="დარეგისტრირდი როგორც საკადრო სააგენტო ან გემთმფლობელი NavigoJobs-ზე." />
    <meta property="og:url" content="https://georgee-21.github.io/navigojobs/register-company.html" />
    <meta property="og:image" content="https://georgee-21.github.io/navigojobs/assets/images/hero-poster.jpg" />
    <title>კომპანიის რეგისტრაცია — NavigoJobs</title>

    <script>
      try {
        if (localStorage.getItem("nj-theme") === "light") document.documentElement.className = "theme-light";
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="page" data-page="company">
    <a class="skip-link" href="#main" data-i18n="ui.skipLink">მთავარ შინაარსზე გადასვლა</a>

    <div data-layout="header"></div>

    <main id="main">
      <header class="page-hero">
        <div class="page-hero-bg page-hero-bg-company" aria-hidden="true"></div>
        <div class="page-hero-overlay" aria-hidden="true"></div>
        <div class="page-hero-content">
          <a href="index.html" class="back-link text-mono" data-i18n="companyRegisterPage.backHome">← მთავარი</a>
          <div class="page-hero-text glass-panel">
            <div class="section-label" data-i18n="companyRegisterPage.kicker">// შემოუერთდი როგორც დამსაქმებელი</div>
            <h1 class="title page-hero-title" data-i18n="companyRegisterPage.title">კომპანიის რეგისტრაცია</h1>
            <p class="text" data-i18n="companyRegisterPage.sub">დარეგისტრირდი, როგორც საკადრო სააგენტო ან გემთმფლობელი და მიიღე წვდომა ვერიფიცირებულ ეკიპაჟის ბაზაზე.</p>
          </div>
        </div>
      </header>

      <section class="section form-section">
        <form class="form" data-nj-form>
            <div class="form-row">
              <div class="form-field">
                <label class="form-label" for="cr-companyName" data-i18n="companyRegisterPage.fields.companyName">კომპანიის დასახელება</label>
                <input class="form-input" id="cr-companyName" name="companyName" type="text" autocomplete="organization" required />
              </div>
              <div class="form-field">
                <label class="form-label" for="cr-regNumber" data-i18n="companyRegisterPage.fields.regNumber">საიდენტიფიკაციო / სარეგისტრაციო ნომერი</label>
                <input class="form-input" id="cr-regNumber" name="regNumber" type="text" required />
              </div>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label class="form-label" for="cr-contactPerson" data-i18n="companyRegisterPage.fields.contactPerson">საკონტაქტო პირი</label>
                <input class="form-input" id="cr-contactPerson" name="contactPerson" type="text" autocomplete="name" required />
              </div>
              <div class="form-field">
                <label class="form-label" for="cr-email" data-i18n="companyRegisterPage.fields.email">ელ. ფოსტა</label>
                <input class="form-input" id="cr-email" name="email" type="email" autocomplete="email" required />
              </div>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label class="form-label" for="cr-phone" data-i18n="companyRegisterPage.fields.phone">ტელეფონი</label>
                <input class="form-input" id="cr-phone" name="phone" type="tel" autocomplete="tel" required />
              </div>
              <div class="form-field">
                <label class="form-label" for="cr-website" data-i18n="companyRegisterPage.fields.website">ვებგვერდი</label>
                <input class="form-input" id="cr-website" name="website" type="url" autocomplete="url" placeholder="https://" />
              </div>
            </div>
            <div class="form-field">
                <label class="form-label" for="cr-address" data-i18n="companyRegisterPage.fields.address">მისამართი</label>
                <input class="form-input" id="cr-address" name="address" type="text" autocomplete="address-line1" required />
              </div>
            <div class="form-field">
                <label class="form-label" for="cr-message" data-i18n="companyRegisterPage.fields.message">დამატებითი ინფორმაცია</label>
                <textarea class="form-textarea" id="cr-message" name="message"></textarea>
              </div>
            <input class="form-honeypot" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" />
            <div class="form-consent">
              <input id="cr-consent" name="consent" type="checkbox" value="yes" required />
              <label for="cr-consent"><span data-i18n="ui.consentLabel"></span> <a href="privacy.html" data-i18n="ui.consentLink"></a></label>
            </div>
            <p class="form-error" data-form-error role="alert" hidden></p>
            <div class="form-buttons">
              <button class="btn-primary" type="submit" data-i18n="companyRegisterPage.submitBtn">რეგისტრაცია</button>
            </div>
        </form>
        <div class="form-success" data-success tabindex="-1" role="status" hidden>
          <div class="form-success-icon" aria-hidden="true">🏢</div>
          <div class="form-success-title" data-i18n="companyRegisterPage.successTitle">მადლობა რეგისტრაციისთვის!</div>
          <p class="text" data-i18n="companyRegisterPage.successMsg">თქვენი განაცხადი მიღებულია — ჩვენი გუნდი დაგიკავშირდებათ მალე.</p>
        </div>
      </section>
    </main>

    <div data-layout="footer"></div>

    <script src="js/translations.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/forms.js" defer></script>
  </body>
</html>
